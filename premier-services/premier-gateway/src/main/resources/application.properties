server.port=8080

# Services Python - vrais ports Docker
services.detection=http://localhost:8011
services.classification=http://localhost:8012
services.segmentation=http://localhost:8013
services.birads=http://localhost:8014
services.assembler=http://localhost:8018
services.llm-narrative=http://localhost:8020
services.localization=http://localhost:8015
services.tumorsize=http://localhost:8016
services.visualization=http://localhost:8019

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/clinique_db
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Multipart
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Timeouts
server.connection-timeout=60000
spring.mvc.async.request-timeout=120000
spring.codec.max-in-memory-size=100MB
spring.webflux.codec.max-in-memory-size=100MB

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tryItOutEnabled=true